name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      webAppHostName: ${{ steps.deploy-bicep.outputs.webAppHostName }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Deploy Bicep
        id: deploy-bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: environmentName=prod

  deploy-backend:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Build FastAPI and Function App
        run: |
          pushd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          popd
          
      - name: Deploy FastAPI Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-inv-prod-${{ secrets.AZURE_SUFFIX }}
          package: backend/
          
      - name: Deploy Function App
        uses: azure/functions-action@v1
        with:
          app-name: func-inv-prod-${{ secrets.AZURE_SUFFIX }}
          package: backend/

  deploy-frontend:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build React App
        run: |
          cd frontend
          npm install
          # Inject the dynamic backend URL from the Bicep output
          echo "VITE_API_URL=https://${{ needs.deploy-infra.outputs.webAppHostName }}" > .env.production
          npm run build
          
      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist"
