name: Deploy to Azure

# Manual, gated by the `production` environment's required reviewers. Needs a federated (OIDC)
# credential for the repo and these secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP, POSTGRES_ADMIN_PASSWORD, JWT_SECRET.
on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Name suffix for the Azure resources"
        default: prod
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      registry: ${{ steps.registry.outputs.loginServer }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision the registry first (images must exist before the apps reference them)
        id: registry
        run: |
          server=$(az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/registry.bicep \
            --parameters environmentName=${{ inputs.environment_name }} \
            --query properties.outputs.loginServer.value -o tsv)
          echo "loginServer=$server" >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: infrastructure
    environment: production
    strategy:
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: web, context: frontend }
          - { name: erp-mock, context: erp-mock }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ needs.infrastructure.outputs.registry }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ needs.infrastructure.outputs.registry }}/invoice-intelligence/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  apps:
    runs-on: ubuntu-latest
    needs: [infrastructure, images]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and container apps
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=${{ inputs.environment_name }}
            imageTag=${{ github.sha }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            jwtSecret=${{ secrets.JWT_SECRET }}
          failOnStdErr: false
      - name: Run database migrations
        run: |
          az containerapp job start \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.deploy.outputs.migrateJobName }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ steps.deploy.outputs.webUrl }}/api/v1/meta" && exit 0
            sleep 10
          done
          exit 1
