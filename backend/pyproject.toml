[project]
name = "invoice-intelligence"
version = "1.0.0"
description = "Accounts-payable automation: invoice extraction, 3-way PO matching, anomaly scoring and approval workflow."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "pdfplumber>=0.11.4",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "rapidfuzz>=3.10",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "sqlglot>=25.30",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Azure Blob Storage + Azure AI Document Intelligence adapters.
azure = [
    "azure-identity>=1.19",
    "azure-storage-blob>=12.23",
    "azure-ai-documentintelligence>=1.0",
]
# OpenAI-compatible LLM client (OpenAI, Azure OpenAI, Ollama, vLLM, ...).
llm = ["openai>=1.54"]
# Synthetic invoice PDFs for the demo seed and sample files.
demo = ["reportlab>=4.2"]

[project.scripts]
iip = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx2>=2.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4.2",
    "openai>=1.54",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "S", "PT", "DTZ", "T20"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is idiomatic
    "S101",   # asserts are fine in tests
    "RUF012", # mutable class attrs are fine on pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "DTZ", "PT018"]
"app/demo/**" = ["S311"]
"app/services/extraction/**" = ["RUF001"]  # typographic apostrophes in French labels are intentional
"app/cli.py" = ["T20"]
"benchmarks/**" = ["T20", "S310"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pypdfium2.*",
    "sklearn.*",
    "joblib.*",
    "reportlab.*",
    "azure.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/demo/*", "app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
