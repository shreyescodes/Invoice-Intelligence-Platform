[project]
name = "invoice-intelligence-platform"
version = "0.1.0"
description = "AI-powered invoice processing, validation, and analytics platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Azure SDKs
    "azure-functions>=1.21",
    "azure-functions-durable>=1.2.7",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.23",
    "azure-keyvault-secrets>=4.8",
    "azure-identity>=1.19",
    "azure-ai-documentintelligence>=1.0",
    "azure-monitor-opentelemetry>=1.6",
    # LLM
    "openai>=1.54",
    # Data
    "snowflake-connector-python>=3.12",
    "pandas>=2.2",
    # ML
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.7",
    "azure-functions-devops-build",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"
