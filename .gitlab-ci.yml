# GitLab CI pipeline.
#
# The deploy stage is the actual point of this file — it authenticates
# to Azure via Workload Identity Federation (OIDC), not a stored
# service principal secret. That's the thing worth understanding here:
# GitLab issues a short-lived ID token for this specific job; Entra ID
# trusts it because of a federated credential configured on an App
# Registration (no client secret ever stored in GitLab CI/CD variables).
#
# One-time setup (do this in the Azure portal or via az cli, not here):
#   1. Create an App Registration + federated credential, subject:
#      "project_path:<group>/<project>:ref_type:branch:ref:main"
#      issuer: https://gitlab.com
#   2. Grant that App Registration's service principal Contributor
#      (or a narrower custom role) on the target resource group.
#   3. Set these as CI/CD variables (not secret values — these are
#      IDs, safe to store): AZURE_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID.

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.11"

lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install ruff mypy
    - ruff check .
    - mypy src

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    # Cosmos/Azurite emulators are heavier than most CI runners want
    # per-job; for unit tests, mock the Azure SDK clients instead
    # (see tests/conftest.py) and reserve real emulator-backed
    # integration tests for a nightly/manual pipeline.
    - name: postgres:16
      alias: analytics-db
  variables:
    POSTGRES_DB: analytics
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  script:
    - pip install --no-cache-dir ".[dev]"
    - pytest --cov=src --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual  # keep this manual until you trust the pipeline
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - >
      az login --service-principal
      -u "$AZURE_CLIENT_ID"
      --tenant "$AZURE_TENANT_ID"
      --federated-token "$AZURE_ID_TOKEN"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    # TODO(phase 6): deploy infra (az deployment group create -f
    # infra/main.bicep) and the app (az functionapp deployment /
    # az webapp deploy for the container image built above).
    - echo "Wire up the actual deploy commands once infra/main.bicep exists"
