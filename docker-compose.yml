# Local stack: `docker compose up --build`, then open http://localhost:8080
#   --profile observability   adds Prometheus (http://localhost:9090) and Grafana (http://localhost:3000)
#   --profile llm             adds Ollama for free-form questions on the Ask page (see README)
name: invoice-intelligence

x-backend: &backend
  build: ./backend
  image: invoice-intelligence/backend:local
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DEMO_MODE: ${DEMO_MODE:-true}
    JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
    DATABASE_URL: postgresql+psycopg://iip:${POSTGRES_PASSWORD:-iip}@postgres:5432/iip
    # NL analytics runs as a role that can only SELECT from the analytics_* views.
    ANALYTICS_DATABASE_URL: postgresql+psycopg://iip_readonly:${READONLY_PASSWORD:-readonly}@postgres:5432/iip
    ERP_BASE_URL: http://erp:8100
    ERP_API_KEY: ${ERP_API_KEY:-dev-erp-key}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: json
    CORS_ORIGINS: '["http://localhost:8080"]'
    LLM_PROVIDER: ${LLM_PROVIDER:-none}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:7b}
    LLM_API_KEY: ${LLM_API_KEY:-}
  volumes:
    - documents:/data
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iip
      POSTGRES_USER: iip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iip}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-readonly}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-readonly-role.sh:/docker-entrypoint-initdb.d/10-readonly-role.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iip -d iip"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  erp:
    build: ./erp-mock
    image: invoice-intelligence/erp-mock:local
    environment:
      ERP_API_KEY: ${ERP_API_KEY:-dev-erp-key}
      ERP_FAILURE_RATE: ${ERP_FAILURE_RATE:-0}
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["iip", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *backend
    command: ["iip", "seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      erp:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["iip", "worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      erp:
        condition: service_healthy

  web:
    build: ./frontend
    image: invoice-intelligence/web:local
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/invoice-intelligence.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:0.11.4
    profiles: [llm]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  documents:
  prometheus:
  grafana:
  ollama:
